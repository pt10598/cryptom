<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現貨價差監控</title>
<style>
:root{color-scheme:dark;--bg:#0d131a;--panel:#151e28;--edge:#273645;--ink:#ecf3fa;--dim:#abc0d1;--mint:#69e4b5;--loss:#ffa79e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:1260px;margin:auto;padding:clamp(16px,4vw,48px)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:20px}
h1,h2{margin:0}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}h2{font-size:19px}
p{margin:5px 0;color:var(--dim)}.muted{color:var(--dim)}
.time{min-width:10ch;text-align:right;font-variant-numeric:tabular-nums}
.feeds{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.feed{padding:6px 12px;border:1px solid var(--edge);border-radius:8px;background:var(--panel)}
.live,.positive{color:var(--mint)}.negative{color:var(--loss)}
section{background:var(--panel);border:1px solid var(--edge);border-radius:14px;margin-bottom:16px;overflow:hidden}
.heading{padding:15px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:9px 16px;border-top:1px solid var(--edge);text-align:left}
th{font-size:13px;color:var(--dim);font-weight:600;background:#101923}
.num{text-align:right}input{accent-color:var(--mint)}label{white-space:nowrap}
a{color:var(--mint)}</style>
</head>
<body>
<main>
<header>
  <div><h1>現貨價差監控</h1><nav><a href="/transfer">轉幣搬磚試算</a> · <a href="/markets">外匯／黃金</a></nav><p id="cost">等待試算參數</p></div>
  <div class="time"><strong id="connection">連線中</strong><p id="clock">—</p></div>
</header>
<div class="feeds" id="feeds"></div>
<section>
  <div class="heading"><h2>跨所價差</h2><label><input type="checkbox" id="only-positive"> 只顯示正淨利</label></div>
  <div class="scroll"><table>
    <thead><tr><th>交易對</th><th>買入 → 賣出</th><th class="num">毛價差</th><th class="num">估算淨報酬</th><th class="num">估算淨利</th><th class="num">一檔容量</th><th class="num">正淨利持續</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</section>
<section>
  <div class="heading"><h2>最新盤口</h2><span class="muted">報價年齡由後端收到時計算</span></div>
  <div class="scroll"><table>
    <thead><tr><th>交易對</th><th>交易所</th><th class="num">買一</th><th class="num">賣一</th><th class="num">報價年齡</th></tr></thead>
    <tbody id="prices"></tbody>
  </table></div>
</section>
<section>
  <div class="heading"><h2>正淨利紀錄</h2><span id="history-status" class="muted">讀取紀錄中</span></div>
  <div class="scroll"><table>
    <thead><tr><th>首次偵測（台北）</th><th>交易對</th><th>買入 → 賣出</th><th class="num">試算金額</th><th class="num">最高估算淨利</th><th class="num">最高估算淨報酬</th><th class="num">觀察持續</th></tr></thead>
    <tbody id="history"></tbody>
  </table></div>
</section>
<section>
  <div class="heading"><h2>ATRIX · USDT/TWD</h2><span class="muted">待接入官方報價</span></div>
</section>
</main>
<script>
const get = id => document.getElementById(id);
const percent = x => (x * 100).toFixed(3) + '%';
const price = new Intl.NumberFormat('en-US', {maximumSignificantDigits: 12});
const clock = new Intl.DateTimeFormat('zh-TW', {timeZone:'Asia/Taipei', timeStyle:'medium'});
let latest = null;
function fill(id, rows, columns, message) {
  const fragment = document.createDocumentFragment();
  for (const row of rows) {
    const tr = fragment.appendChild(document.createElement('tr'));
    row.forEach((value, index) => {
      const td = tr.insertCell();
      td.textContent = value;
      if (index >= 2) td.classList.add('num');
      if (id === 'rows' && (index === 3 || index === 4)) {
        td.classList.add(String(value).startsWith('-') ? 'negative' : 'positive');
      }
    });
  }
  if (!rows.length) {
    const td = fragment.appendChild(document.createElement('tr')).insertCell();
    td.colSpan = columns;
    td.textContent = message;
    td.className = 'muted';
  }
  get(id).replaceChildren(fragment);
}
function render() {
  if (!latest?.rows) return;
  const {at, status, amounts, fees, buffer, prices, rows} = latest;
  get('clock').textContent = clock.format(at * 1000);
  get('cost').textContent = '單筆 ' + Object.entries(amounts).map(([unit, size]) => size + ' ' + unit).join('・') + '　｜　' +
    Object.entries(fees).map(([name, fee]) => name + ' ' + percent(fee)).join('・') +
    '　｜　預留成本 ' + percent(buffer);
  const feedNames = Object.keys(fees);
  get('feeds').replaceChildren(...feedNames.map(name => {
    const span = document.createElement('span');
    span.className = 'feed';
    span.textContent = name + ' · ' + (status[name] || '啟動中');
    return span;
  }));
  const positive = get('only-positive').checked;
  fill('rows', rows.filter(r => !positive || r[5] > 0).map(r => [
    r[0], r[1] + ' → ' + r[2], percent(r[3]), percent(r[4]), price.format(r[5]) + ' ' + r[8],
    price.format(r[6]) + ' ' + r[8], r[5] > 0 ? (r[7] / 1000).toFixed(1) + ' 秒' : '—'
  ]), 7, positive ? '目前沒有符合條件的正淨利價差' : '等待雙邊新鮮且掛單量足夠的報價');
  fill('prices', prices.map(r => [r[0], r[1], price.format(r[2]), price.format(r[3]), r[4] + ' ms']),
       5, '等待交易所行情');
}
fill('rows', [], 7, '等待交易所行情');
fill('prices', [], 5, '等待交易所行情');
get('only-positive').addEventListener('change', render);
const historyClock = new Intl.DateTimeFormat('zh-TW', {
  timeZone: 'Asia/Taipei', dateStyle: 'short', timeStyle: 'medium'
});
async function refreshHistory() {
  try {
    const response = await fetch('/api/history');
    const data = await response.json();
    get('history-status').textContent = data.error
      ? '紀錄暫時無法完整更新 · ' + data.storage : '最近 100 筆 · ' + data.storage;
    fill('history', data.rows.map(r => [
      historyClock.format(r.started_at * 1000), r.pair, r.buy + ' → ' + r.sell,
      price.format(r.amount) + ' ' + r.currency, price.format(r.peak_net) + ' ' + r.currency,
      percent(r.peak_rate), (r.duration_ms / 1000).toFixed(1) + ' 秒'
    ]), 7, data.error ? '等待紀錄儲存服務' : '尚未記錄到正淨利機會');
  } catch {
    get('history-status').textContent = '無法讀取紀錄';
  } finally {
    setTimeout(refreshHistory, 5000);
  }
}
refreshHistory();
const stream = new EventSource('/events');
stream.onmessage = event => {
  latest = JSON.parse(event.data);
  get('connection').textContent = '網頁已連線';
  get('connection').className = 'live';
  render();
};
stream.onerror = () => {
  latest = null;
  get('connection').textContent = '重新連線中';
  get('connection').className = '';
  get('clock').textContent = '—';
  get('feeds').replaceChildren();
  fill('rows', [], 7, '等待重新連線');
  fill('prices', [], 5, '等待重新連線');
};
</script>
</body>
</html>
